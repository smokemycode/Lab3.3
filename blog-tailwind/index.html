<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<!-- displays site properly based on user's device -->

		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="./assets/images/favicon-32x32.png" />

		<title>Frontend Mentor | Blog preview card</title>

		<!-- <link rel="stylesheet" href="./styles.css" /> -->
		<script src="https://cdn.tailwindcss.com"></script>
	</head>
	<body
		class="flex flex-col justify-center items-center min-h-screen bg-amber-300 font-sans p-6">
		<div
			class="w-full flex flex-col items-center p-4 border-2 border-black rounded-xl shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] max-w-[330px] bg-white gap-6">
			<div class="rounded-xl">
				<img
					class="rounded-xl"
					src="./assets/images/illustration-article.svg"
					alt="Blog Image Preview that links to the blog post" />
			</div>
			<div class="flex flex-col items-start gap-3">
				<button
					class="bg-amber-300 text-black font-extrabold py-1 px-4 text-sm">
					Learning
				</button>
				<p class="font-medium text-xs">Published 21 Dec 2023</p>
				<h1 class="font-extrabold text-xl">
					<a href="#">HTML & CSS foundations</a>
				</h1>
				<p class="text-sm text-neutral-600">
					These languages are the backbone of every website, defining structure,
					content, and presentation.
				</p>
				<div class="flex items-center gap-4">
					<img
						class="size-8"
						src="./assets/images/image-avatar.webp"
						alt="Author's profile picture" />
					<p class="font-bold text-sm">Greg Hooper</p>
				</div>
			</div>
		</div>

		<footer class="flex items-center text-xs gap-1 m-6">
			Challenge by
			<a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
			Coded by <a href="https://www.linkedin.com/in/jai-codes/">Jai</a>.
		</footer>
	</body>
</html>
