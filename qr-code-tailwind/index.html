<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<!-- displays site properly based on user's device -->

		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="./images/favicon-32x32.png" />

		<title>Frontend Mentor | QR code component</title>
		<!-- <link rel="stylesheet" href="styles.css" /> -->
		<script src="https://cdn.tailwindcss.com"></script>
	</head>

	<body
		class="flex flex-col justify-center items-center min-h-screen bg-blue-100 font-sans p-6">
		<div class="w-full flex flex-col items-center p-4  rounded-xl shadow-4 max-w-[320px] bg-white gap-6">
			<div class="flex flex-col text-center items-center gap-4">
					<img class="rounded-xl shadow-4" src="./images/image-qr-code.png" alt="QR code" />
					<h1 class="text-xl text-[#1f3251] font-bold px-6">
						Improve your front-end skills by building projects
					</h1>
					<p class="text-[#1f3251] font-normal px-3 pb-6">
						Scan the QR code to visit Frontend  Mentor and take your coding
						skills to the next level
					</p>
			</div>
		</div>
	</body>
</html>
